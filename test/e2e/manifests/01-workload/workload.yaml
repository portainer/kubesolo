# Tier 1 — workload & networking: a multi-replica Deployment fronted by a
# ClusterIP Service (in-cluster routing) and a NodePort Service (allocation).
apiVersion: v1
kind: Namespace
metadata:
  name: tier1-workload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: tier1-workload
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-clusterip
  namespace: tier1-workload
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-nodeport
  namespace: tier1-workload
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
