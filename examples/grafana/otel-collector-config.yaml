# Example OpenTelemetry Collector configuration for collecting KubeSolo metrics
# and sending them to Grafana Cloud or another Prometheus remote_write endpoint.
#
# This file provides an OpenTelemetry equivalent to `alloy-config.yaml` in this
# same directory. Both configurations scrape the same three targets and feed the
# same dashboards. Choose whichever collector best suits your environment.
#
# The three scrape jobs below (the API server's /metrics endpoint, the kubelet's
# cAdvisor metrics and KubeSolo's own metrics server) feed every panel across
# both dashboards. The node name in the cAdvisor metrics_path (default
# "kubesolo") must match your node (`kubectl get nodes`), otherwise no
# container metrics are scraped:
#   kubesolo-grafana-dashboard-classic.json
#   kubesolo-grafana-dashboard-apiv2.json
#
# The rest of this file sets up the authentication and RBAC permissions needed
# to scrape those targets and forward their data.
#
# IMPORTANT: This setup requires the "contrib" image of the OpenTelemetry
# Collector (otel/opentelemetry-collector-contrib), not the "core" image
# (otel/opentelemetry-collector). The prometheus receiver, basicauth extension,
# and prometheusremotewrite exporter ship only with contrib. Starting the core
# image with this configuration will fail with an "unknown component type" error.
#
# This example assumes the Collector was installed with the official Helm chart
# (https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector)
# in the "default" namespace using a ServiceAccount named "otel-collector".
# Adjust the ClusterRoleBinding subject below if your release uses a different
# name or namespace. The ConfigMap has no `namespace:`, so it lands in the
# namespace you apply it to (use `-n <ns>` to match your release).
#
# The kubesolo-metrics job scrapes 127.0.0.1:9105, which is the loopback of the
# KubeSolo container. Run the Collector pod with hostNetwork: true and
# dnsPolicy: ClusterFirstWithHostNet (Helm: hostNetwork: true) so it shares
# that network namespace, and start KubeSolo with KUBESOLO_METRICS_SERVER=true.
# See README.md, "Why Alloy uses hostNetwork" for an alternative approach.
#
# In your Helm values, configure the contrib image:
#   image.repository: otel/opentelemetry-collector-contrib
#   command.name: otelcol-contrib
#
# Apply with: kubectl apply -f otel-collector-config.yaml
#
# Then configure the Collector to mount this ConfigMap. When using the Helm chart,
# set `configMap.create: false` and use `extraVolumes`/`extraVolumeMounts` to mount
# the file at /etc/otelcol-contrib/config.yaml. If you run the Collector standalone,
# pass the file path to the `--config` flag instead.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesolo-otel-metrics
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  # kubelet cAdvisor, proxied through the apiserver
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesolo-otel-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesolo-otel-metrics
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: default
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubesolo-otel-collector-config
data:
  config.yaml: |
    # These scrape jobs are the basis for every panel in
    # kubesolo-grafana-dashboard-classic.json / kubesolo-grafana-dashboard-apiv2.json:
    #   - kubesolo-apiserver: kube-apiserver's own /metrics, reached
    #     through the kubernetes.default.svc Service.
    #   - kubesolo-kubelet-cadvisor: container metrics via the apiserver node
    #     proxy. "kubesolo" in metrics_path is the node name; must match yours.
    #   - kubesolo-metrics:   KubeSolo's own metrics server on
    #     127.0.0.1:9105 (needs hostNetwork, see header).
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: "kubesolo-apiserver"
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              metrics_path: /metrics
              static_configs:
                - targets: ["kubernetes.default.svc"]
            - job_name: "kubesolo-kubelet-cadvisor"
              scheme: https
              bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
              tls_config:
                ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              metrics_path: /api/v1/nodes/kubesolo/proxy/metrics/cadvisor
              static_configs:
                - targets: ["kubernetes.default.svc"]
            - job_name: "kubesolo-metrics"
              scheme: http
              metrics_path: /metrics
              static_configs:
                - targets: ["127.0.0.1:9105"]

    # Basic-auth credentials for the Grafana Cloud remote_write endpoint,
    # referenced by the exporter below via `auth.authenticator`. ${env:...}
    # is expanded from the Collector container's environment at startup.
    extensions:
      basicauth/grafanacloud:
        client_auth:
          username: ${env:GRAFANA_CLOUD_USERNAME}
          password: ${env:GRAFANA_CLOUD_API_KEY}

    exporters:
      prometheusremotewrite:
        endpoint: ${env:GRAFANA_CLOUD_URL}
        auth:
          authenticator: basicauth/grafanacloud

    service:
      extensions: [basicauth/grafanacloud]
      pipelines:
        metrics:
          receivers: [prometheus]
          exporters: [prometheusremotewrite]
