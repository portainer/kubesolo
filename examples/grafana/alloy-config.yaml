# Runs Grafana Alloy as a regular workload *inside* the KubeSolo cluster,
# scraping KubeSolo's metrics and shipping them to Grafana Cloud (or another
# Prometheus remote_write endpoint).
#
# The "kubesolo" scrape targets the API server's /metrics and the kubelet's
# cAdvisor metrics (via the API server node proxy); "kubesolo_self" scrapes
# KubeSolo's own metrics server. Both dashboards in this folder use these
# three targets. The node name in the cAdvisor path (default "kubesolo") must
# match your node (`kubectl get nodes`), otherwise no container metrics.
#   kubesolo-grafana-dashboard-classic.json
#   kubesolo-grafana-dashboard-apiv2.json
#
# Everything is created in the "default" namespace (no Namespace object, no
# `namespace:` fields), so it works on a fresh cluster. The only exception is
# the ClusterRoleBinding subject, where Kubernetes requires a namespace.
#
# Prerequisites:
#   - KubeSolo started with KUBESOLO_METRICS_SERVER=true (serves :9105).
#   - The grafana-cloud-credentials Secret must exist BEFORE applying this
#     file, otherwise the pod fails with CreateContainerConfigError. Create it
#     with the command in README.md ("Creating the credentials Secret").
#     It is not defined here so re-applying this file never overwrites your
#     real token. For reference, its shape is:
#
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: grafana-cloud-credentials
#   type: Opaque
#   stringData:
#     GRAFANA_CLOUD_URL: https://prometheus-prod-XX-prod-REGION.grafana.net/api/prom/push
#     GRAFANA_CLOUD_USERNAME: "1234567"
#     GRAFANA_CLOUD_API_KEY: "<your-real-token>"
#
# Apply with:
#   podman exec -i kubesolo kubectl apply -f - < alloy-config.yaml
# (or `kubectl apply -f alloy-config.yaml` if you have a kubeconfig)
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
# Read access to the apiserver's own /metrics (non-resource URL) and to the
# kubelet endpoints proxied through the apiserver (cAdvisor)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-metrics-reader
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-metrics-reader
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: default
roleRef:
  kind: ClusterRole
  name: alloy-metrics-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    // kubesolo-apiserver: kube-apiserver's own /metrics, reached through the
    // kubernetes.default.svc Service.
    // kubesolo-kubelet-cadvisor: container metrics via the apiserver node
    // proxy. "kubesolo" in the path is the node name and must match yours.
    prometheus.scrape "kubesolo" {
      targets = [
        {
          "__address__"      = "kubernetes.default.svc",
          "__metrics_path__" = "/metrics",
          "job"              = "kubesolo-apiserver",
        },
        {
          "__address__"      = "kubernetes.default.svc",
          "__metrics_path__" = "/api/v1/nodes/kubesolo/proxy/metrics/cadvisor",
          "job"              = "kubesolo-kubelet-cadvisor",
        },
      ]

      scheme            = "https"
      bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

      tls_config {
        ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
      }

      forward_to = [prometheus.remote_write.grafanacloud.receiver]
    }

    // KubeSolo's own metrics server (KUBESOLO_METRICS_SERVER=true). It binds to
    // 127.0.0.1:9105 inside the KubeSolo container by default, so the Alloy pod
    // runs with hostNetwork: true to share that network namespace. To stay on
    // the pod network instead, see README.md ("Why Alloy uses hostNetwork"):
    // start KubeSolo with KUBESOLO_METRICS_BIND_ADDRESS=0.0.0.0:9105 and
    // scrape the node InternalIP.
    prometheus.scrape "kubesolo_self" {
      targets = [
        {
          "__address__"      = "127.0.0.1:9105",
          "__metrics_path__" = "/metrics",
          "job"              = "kubesolo-metrics",
        },
      ]

      forward_to = [prometheus.remote_write.grafanacloud.receiver]
    }

    prometheus.remote_write "grafanacloud" {
      endpoint {
        url = env("GRAFANA_CLOUD_URL")

        basic_auth {
          username = env("GRAFANA_CLOUD_USERNAME")
          password = env("GRAFANA_CLOUD_API_KEY")
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-alloy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      serviceAccountName: alloy
      # Needed to reach KubeSolo's metrics server on 127.0.0.1:9105 (see
      # README.md, "Why Alloy uses hostNetwork"). Not needed if you set
      # KUBESOLO_METRICS_BIND_ADDRESS=0.0.0.0:9105 and scrape the node
      # InternalIP instead; see the same README section.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:latest
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - /etc/alloy/config.alloy
          envFrom:
            - secretRef:
                name: grafana-cloud-credentials
          ports:
            - name: http-metrics
              containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: alloy-config
