name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # glibc builds (all architectures)
          - goos: linux
            goarch: amd64
            libc: glibc
            build_target: build
          - goos: linux
            goarch: arm64
            libc: glibc
            build_target: build
          - goos: linux
            goarch: arm
            libc: glibc
            build_target: build
          - goos: linux
            goarch: riscv64
            libc: glibc
            build_target: build
          # musl builds (amd64 and arm64 only)
          - goos: linux
            goarch: amd64
            libc: musl
            build_target: build-musl
          - goos: linux
            goarch: arm64
            libc: musl
            build_target: build-musl
    steps:
    - uses: actions/checkout@v4
    - id: get_version
      uses: battila7/get-version-action@v2
    - name: Set build time
      run: echo BUILD_TIME=$(date) >> ${GITHUB_ENV}
    - uses: wangyoucao577/go-release-action@v1
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        pre_command: make release-workflow-deps
        build_command: 'make ${{ matrix.build_target }} GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} OUTPUT=kubesolo'
        asset_name: kubesolo-${{ steps.get_version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.libc == 'musl' && '-musl' || '' }}
