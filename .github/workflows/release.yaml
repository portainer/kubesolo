name: release

on:
  workflow_dispatch:
    inputs:
      kubesolo_version:
        description: "kubesolo version. e.g. v0.1.6-beta"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: release for kubesolo-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.libc == 'musl' && '-musl' || '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # glibc builds (all architectures)
          - goos: linux
            goarch: amd64
            libc: glibc
            build_target: build
          - goos: linux
            goarch: arm64
            libc: glibc
            build_target: build
          - goos: linux
            goarch: arm
            libc: glibc
            build_target: build
          - goos: linux
            goarch: riscv64
            libc: glibc
            build_target: build
          # musl builds (amd64 and arm64 only)
          - goos: linux
            goarch: amd64
            libc: musl
            build_target: build-musl
          - goos: linux
            goarch: arm64
            libc: musl
            build_target: build-musl
    steps:
    - name: "[preparation] checkout the current branch"
      uses: actions/checkout@v4
    - name: "[preparation] set build time"
      run: echo BUILD_TIME=$(date) >> ${GITHUB_ENV}
    - name: "[preparation] set up golang"
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: "[preparation] release-workflow-deps"
      run: sudo make release-workflow-deps
    - name: "[execution] build the binary for ${{ matrix.goos }}/${{ matrix.goarch }}"
      run: make ${{ matrix.build_target }} GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} OUTPUT=kubesolo
    - name: "[execution] upload artifact"
      uses: actions/upload-artifact@v4
      with:
        name: kubesolo-${{ github.event.inputs.kubesolo_version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.libc == 'musl' && '-musl' || '' }}
        path: ./dist/kubesolo
        retention-days: 30