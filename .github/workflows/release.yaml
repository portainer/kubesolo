name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # glibc builds (all architectures)
          - goos: linux
            goarch: amd64
            libc: glibc
            build_target: build
          - goos: linux
            goarch: arm64
            libc: glibc
            build_target: build
          - goos: linux
            goarch: arm
            libc: glibc
            build_target: build
          - goos: linux
            goarch: riscv64
            libc: glibc
            build_target: build
          # musl builds (amd64 and arm64 only)
          - goos: linux
            goarch: amd64
            libc: musl
            build_target: build-musl
          - goos: linux
            goarch: arm64
            libc: musl
            build_target: build-musl
    steps:
    - name: "[preparation] checkout the current branch"
      uses: actions/checkout@v4
    - name: "[preparation] set build time"
      run: echo BUILD_TIME=$(date) >> ${GITHUB_ENV}
    - name: "[preparation] get the kubesolo version"
      id: get_version
      run: |
        VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
        echo "Extracted version: $VERSION"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT" # Set output for subsequent steps
    - name: "[preparation] set up golang"
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum
    - name: "[preparation] release-workflow-deps"
      run: make release-workflow-deps
    - name: "[execution] build the binary for ${{ matrix.goos }}/${{ matrix.goarch }}"
      run: make ${{ matrix.build_target }} GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} OUTPUT=kubesolo
    - name: "[execution] upload artifact"
      uses: actions/upload-artifact@v4
      with:
        name: kubesolo-${{ steps.get_version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.libc == 'musl' && '-musl' || '' }}
        path: ./dist/kubesolo
        retention-days: 30