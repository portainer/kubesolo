name: assistant-knowledge

# Publishes the assistant's knowledge file, build/assistant/knowledge.md, as an
# OCI artifact whose single layer is the file itself. The model reads it to
# triage incidents, so it can be improved without a KubeSolo release.
#
# Run once per revision of the knowledge, not per KubeSolo release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. 0.1.0"
        required: true

env:
  REPOSITORY: docker.io/portainerci/kubesolo-assistant-knowledge
  ORAS_VERSION: "1.3.4"
  # KubeSolo refuses a larger file: pkg/assistant MaxKnowledgeBytes.
  MAX_BYTES: 12288

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check the size
        run: |
          size=$(stat -c %s build/assistant/knowledge.md)
          if [ "${size}" -gt "${MAX_BYTES}" ]; then
            echo "knowledge.md is ${size} bytes; KubeSolo reads at most ${MAX_BYTES}" >&2
            exit 1
          fi

      - name: Install oras
        run: |
          base="https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}"
          tarball="oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base}/${tarball}"
          curl -fsSL "${base}/oras_${ORAS_VERSION}_checksums.txt" | grep " ${tarball}\$" | sha256sum -c -
          tar -xzf "${tarball}" oras
          sudo install oras /usr/local/bin/oras

      - name: Log in to Docker Hub
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: echo "${DOCKER_HUB_PASSWORD}" | oras login docker.io -u "${DOCKER_HUB_USERNAME}" --password-stdin

      - name: Push the knowledge
        working-directory: build/assistant
        env:
          TAG: ${{ inputs.tag }}
        run: oras push "${REPOSITORY}:${TAG}" knowledge.md:text/markdown
