name: Build Pause Image

on:
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: portainer/pause

jobs:
  build-pause:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            arch: amd64
            platform: linux/amd64
            gcc: x86_64-linux-gnu-gcc
          - goos: linux
            goarch: arm64
            arch: arm64
            platform: linux/arm64
            gcc: aarch64-linux-gnu-gcc
          - goos: linux
            goarch: arm
            arch: arm
            platform: linux/arm/v7
            gcc: arm-linux-gnueabihf-gcc
          - goos: linux
            goarch: arm
            arch: armv6
            platform: linux/arm/v6
            gcc: arm-linux-gnueabihf-gcc
          - goos: linux
            goarch: riscv64
            arch: riscv64
            platform: linux/riscv64
            gcc: riscv64-linux-gnu-gcc
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sparse checkout kubernetes pause directory
        run: |
          # Create a temporary directory for the sparse checkout
          mkdir -p /tmp/k8s-pause
          cd /tmp/k8s-pause
          
          # Initialize git and add kubernetes remote
          git init
          git remote add origin https://github.com/kubernetes/kubernetes.git
          
          # Configure sparse checkout to only get the pause directory
          git config core.sparseCheckout true
          echo "build/pause/*" > .git/info/sparse-checkout
          
          # Fetch and checkout only the pause directory
          git pull --depth=1 origin master
          
          # Copy the pause directory to our workspace
          cp -r build/pause ${{ github.workspace }}/pause-build
          
          # List contents to verify
          echo "Contents of pause directory:"
          ls -la ${{ github.workspace }}/pause-build/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          sudo make install-cross-compilers

      - name: Build pause binary directly
        run: |
          cd ${{ github.workspace }}/pause-build
          
          # Create bin directory
          mkdir -p bin
          
          # Set version (matching Kubernetes pause version)
          VERSION="v1.34.0-go1.24.3-bullseye.0"
          
          # Compile pause binary directly using the appropriate cross-compiler
          echo "Building pause binary for ${{ matrix.goarch }} using ${{ matrix.gcc }}"
          ${{ matrix.gcc }} -Os -Wall -Werror -static -DVERSION=${VERSION} -o bin/pause-linux-${{ matrix.goarch }} pause.c
          
          # Strip the binary to reduce size
          case "${{ matrix.goarch }}" in
            amd64)
              x86_64-linux-gnu-strip bin/pause-linux-${{ matrix.goarch }}
              ;;
            arm64)
              aarch64-linux-gnu-strip bin/pause-linux-${{ matrix.goarch }}
              ;;
            arm)
              arm-linux-gnueabihf-strip bin/pause-linux-${{ matrix.goarch }}
              ;;
            riscv64)
              riscv64-linux-gnu-strip bin/pause-linux-${{ matrix.goarch }}
              ;;
          esac
          
          # Check what was built
          echo "Built binary for ${{ matrix.goarch }}:"
          ls -la bin/
          file bin/pause-linux-${{ matrix.goarch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest-${{ matrix.arch }}

      - name: Build and push single-arch image
        uses: docker/build-push-action@v5
        with:
          context: ./pause-build
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE=scratch
            ARCH=${{ matrix.goarch }}

  create-manifest:
    needs: build-pause
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create and push multi-arch manifest
        run: |
          # Create multi-arch manifest
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-armv6 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-riscv64

          # Annotate each architecture in the manifest
          docker manifest annotate ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-amd64 --arch amd64
          docker manifest annotate ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64 --arch arm64
          docker manifest annotate ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm --arch arm --variant v7
          docker manifest annotate ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-armv6 --arch arm --variant v6
          docker manifest annotate ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-riscv64 --arch riscv64

          # Push the multi-arch manifest
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Clean up
        if: always()
        run: |
          rm -rf /tmp/k8s-pause
          rm -rf ${{ github.workspace }}/pause-build 