name: Build Pause Image

on:
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: portainer/pause

jobs:
  build-pause:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sparse checkout kubernetes pause directory
        run: |
          # Create a temporary directory for the sparse checkout
          mkdir -p /tmp/k8s-pause
          cd /tmp/k8s-pause
          
          # Initialize git and add kubernetes remote
          git init
          git remote add origin https://github.com/kubernetes/kubernetes.git
          
          # Configure sparse checkout to only get the pause directory
          git config core.sparseCheckout true
          echo "build/pause/*" > .git/info/sparse-checkout
          
          # Fetch and checkout only the pause directory
          git pull --depth=1 origin master
          
          # Copy the pause directory to our workspace
          cp -r build/pause ${{ github.workspace }}/pause-build
          
          # List contents to verify
          echo "Contents of pause directory:"
          ls -la ${{ github.workspace }}/pause-build/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/386,linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/riscv64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:buildx-stable-1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: ./pause-build
          platforms: linux/386,linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v6,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE=scratch

      - name: Clean up
        if: always()
        run: |
          rm -rf /tmp/k8s-pause
          rm -rf ${{ github.workspace }}/pause-build 