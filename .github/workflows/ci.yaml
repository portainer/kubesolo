name: ci

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        # glibc builds
        - goos: linux
          goarch: amd64
          libc: glibc
          build_target: build
        - goos: linux
          goarch: arm64
          libc: glibc
          build_target: build
        # musl builds (required for Alpine and other musl-based distros)
        - goos: linux
          goarch: amd64
          libc: musl
          build_target: build-musl
        - goos: linux
          goarch: arm64
          libc: musl
          build_target: build-musl
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "[preparation] set up golang"
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: "[preparation] install cross-compilation toolchains"
        run: sudo make install-cross-compilers${{ matrix.libc == 'musl' && ' install-musl-cross-compilers' || '' }}
      - name: "[execution] build the binary for ${{ matrix.goos }}/${{ matrix.goarch }} (${{ matrix.libc }})"
        run: make ${{ matrix.build_target }} GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
      - name: "[execution] upload artifact"
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: kubesolo-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.libc == 'musl' && '-musl' || '' }}
          path: ./dist/kubesolo
          retention-days: 30

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "[preparation] set up golang"
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: "[preparation] install cross-compilation toolchains"
        run: sudo make install-cross-compilers install-musl-cross-compilers
      - name: "[execution] build linux/amd64 musl binary"
        run: make build-musl GOOS=linux GOARCH=amd64
      - name: "[preparation] resolve image tag"
        id: image
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
            echo "tags=portainerci/kubesolo:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "tags=portainerci/kubesolo:ci" >> "$GITHUB_OUTPUT"
          fi
      - name: "[preparation] set up docker buildx"
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: "[preparation] log in to docker hub"
        if: github.event_name == 'pull_request'
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: "[execution] build docker image"
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.image.outputs.push }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max