name: release
run-name: "${{ github.event.inputs.kubesolo_version }} release 🚀"

on:
  workflow_dispatch:
    inputs:
      kubesolo_version:
        description: "kubesolo version. e.g. v0.x.x, v0.x.x-beta"
        required: true

permissions:
  contents: write

jobs:
  # Warms the shared setup-go cache with the complete module graph before the
  # build matrix starts; see the go-mod-cache job in ci.yml for why. The release
  # is only created once this succeeds, so a proxy outage leaves no empty
  # pre-release behind.
  go-mod-cache:
    name: go module cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "[preparation] set up golang"
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: "[execution] download go modules"
        run: |
          for attempt in 1 2 3; do
            go mod tidy && exit 0
            echo "go mod tidy failed (attempt ${attempt}/3), retrying in 15s"
            sleep 15
          done
          exit 1

  # The release is cut from develop, so gate it on the develop image: idle
  # footprint ceilings plus the control-plane load, before anything is published.
  perf-gate:
    name: perf gate (amd64)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: "[preparation] set up golang"
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: "[preparation] build kubesoloctl and loadgen"
        run: |
          make build-kubesoloctl GOOS=linux GOARCH=amd64 KUBESOLOCTL_OUTPUT=./dist/kubesoloctl
          go build -o ./dist/loadgen ./test/perf/loadgen
      - name: "[preparation] install kubectl"
        run: |
          curl -fsSLo /usr/local/bin/kubectl https://dl.k8s.io/release/v1.36.6/bin/linux/amd64/kubectl
          chmod +x /usr/local/bin/kubectl
      - name: "[preparation] log in to docker hub"
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: "[execution] idle footprint"
        run: IMAGE=portainerci/kubesolo:develop PROFILE_DIR=test/perf/profiles/bench KUBESOLOCTL=./dist/kubesoloctl test/perf/bench.sh
      - name: "[execution] control-plane load"
        run: IMAGE=portainerci/kubesolo:develop PROFILE_DIR=test/perf/profiles/load KUBESOLOCTL=./dist/kubesoloctl LOADGEN=./dist/loadgen test/perf/load.sh
      - name: "[reporting] upload result"
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: perf-release-amd64
          path: |
            test/perf/result.amd64.json
            test/perf/load.amd64.json
            test/perf/profiles/
          retention-days: 90
          if-no-files-found: ignore

  create-release:
    name: create-release
    runs-on: ubuntu-latest
    needs: [go-mod-cache, perf-gate]
    steps:
      - name: "[execution] create a pre-release"
        run: |
          gh release create \
            "${{ github.event.inputs.kubesolo_version }}" \
            --repo portainer/kubesolo \
            --title "${{ github.event.inputs.kubesolo_version }}" \
            --target develop \
            --prerelease \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    name: release for kubesolo-linux-${{ matrix.goarch }}${{ matrix.libc == 'musl' && '-musl' || '' }}${{ matrix.variant == 'offline' && '-offline' || '' }}
    runs-on: ubuntu-latest
    needs: [create-release]
    strategy:
      matrix:
        goarch: [amd64, arm64, arm, riscv64]
        libc: [glibc, musl]
        variant: [online, offline]
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          tags: true
      - name: "[preparation] set build time"
        run: echo BUILD_TIME=$(date) >> ${GITHUB_ENV}
      - name: "[preparation] set up QEMU for cross-platform Docker builds"
        if: matrix.goarch == 'arm'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm
      - name: "[preparation] set up golang"
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: "[preparation] release-workflow-deps"
        run: sudo make release-workflow-deps
      - name: "[preparation] resolve build target"
        id: target
        run: |
          TARGET="build"
          if [[ "${{ matrix.libc }}" == "musl" ]]; then TARGET="build-musl"; fi
          if [[ "${{ matrix.variant }}" == "offline" ]]; then TARGET="${TARGET}-offline"; fi
          echo "build_target=${TARGET}" >> "$GITHUB_OUTPUT"
      - name: "[execution] build the binary for linux/${{ matrix.goarch }}"
        run: make ${{ steps.target.outputs.build_target }} GOOS=linux GOARCH=${{ matrix.goarch }} VERSION="${{ github.event.inputs.kubesolo_version }}" OUTPUT=kubesolo
      - name: "[post] upload artifacts to github release"
        run: |
          dist=kubesolo-${{ github.event.inputs.kubesolo_version }}-linux-${{ matrix.goarch }}${{ matrix.libc == 'musl' && '-musl' || '' }}${{ matrix.variant == 'offline' && '-offline' || '' }}
          tar -czf "$dist.tar.gz" kubesolo
          gh release upload --clobber --repo portainer/kubesolo "${{ github.event.inputs.kubesolo_version }}" "$dist.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: docker image for linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [create-release]
    permissions:
      contents: read
    env:
      REGISTRY: portainer
      IMAGE_NAME: kubesolo
    strategy:
      matrix:
        goarch: [amd64, arm64, arm, riscv64]
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          tags: true
      - name: "[preparation] set up QEMU for cross-platform Docker builds"
        if: matrix.goarch != 'amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: linux/${{ matrix.goarch }}
      - name: "[preparation] set up golang"
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: "[preparation] release-workflow-deps"
        run: sudo make release-workflow-deps
      - name: "[execution] build linux/${{ matrix.goarch }} musl binary"
        run: make build-musl GOOS=linux GOARCH=${{ matrix.goarch }} VERSION="${{ github.event.inputs.kubesolo_version }}"
      - name: "[preparation] set up docker buildx"
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: "[preparation] log in to docker hub"
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: "[execution] build and push linux/${{ matrix.goarch }} image"
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          platforms: linux/${{ matrix.goarch }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.kubesolo_version }}-linux-${{ matrix.goarch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-kubesoloctl:
    name: build kubesoloctl-${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: [create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: riscv64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: "[preparation] checkout the current branch"
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          tags: true
      - name: "[preparation] set up golang"
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: "[execution] build kubesoloctl for ${{ matrix.goos }}/${{ matrix.goarch }}"
        run: |
          make build-kubesoloctl \
            GOOS=${{ matrix.goos }} \
            GOARCH=${{ matrix.goarch }} \
            GOARM=${{ matrix.goarm }} \
            VERSION="${{ github.event.inputs.kubesolo_version }}" \
            KUBESOLOCTL_OUTPUT=./dist/kubesoloctl-${{ matrix.goos }}-${{ matrix.goarch }}
      - name: "[post] upload kubesoloctl to github release"
        run: |
          gh release upload --clobber \
            --repo portainer/kubesolo \
            "${{ github.event.inputs.kubesolo_version }}" \
            "./dist/kubesoloctl-${{ matrix.goos }}-${{ matrix.goarch }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: publish SHA256SUMS
    runs-on: ubuntu-latest
    needs: [build, build-kubesoloctl]
    steps:
      # kubesoloctl upgrade/download and the upgrade API verify every archive
      # against this file before installing it.
      - name: "[execution] checksum every release asset"
        run: |
          mkdir -p assets && cd assets
          gh release download --repo portainer/kubesolo "${{ github.event.inputs.kubesolo_version }}" \
            --pattern 'kubesolo-*.tar.gz' --pattern 'kubesoloctl-*'
          sha256sum kubesolo-*.tar.gz kubesoloctl-* | sort -k2 > SHA256SUMS
          cat SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "[post] upload SHA256SUMS to github release"
        run: |
          gh release upload --clobber --repo portainer/kubesolo \
            "${{ github.event.inputs.kubesolo_version }}" assets/SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-manifest:
    name: create multi-arch docker manifest
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
    env:
      REGISTRY: portainer
      IMAGE_NAME: kubesolo
    steps:
      - name: "[preparation] log in to docker hub"
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      - name: "[preparation] set up docker buildx"
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: "[execution] create and push multi-arch manifest"
        run: |
          VERSION="${{ github.event.inputs.kubesolo_version }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker buildx imagetools create \
            -t ${IMAGE}:${VERSION} \
            ${IMAGE}:${VERSION}-linux-amd64 \
            ${IMAGE}:${VERSION}-linux-arm64 \
            ${IMAGE}:${VERSION}-linux-arm \
            ${IMAGE}:${VERSION}-linux-riscv64
